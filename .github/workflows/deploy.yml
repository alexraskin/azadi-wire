name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Apply D1 migrations before deploying
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        if: github.event_name != 'workflow_dispatch' || inputs.run_migrations
        run: npx wrangler d1 migrations apply azadi-wire-db --remote

      - name: Build
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://azadiwire.org/)
            [ "$code" = "200" ] && exit 0
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "site did not return 200 after deploy"
          exit 1
